[core]
plugins = autostart command decoration move resize place switcher grid expo vswitch wayfire-shell foreign-toplevel wm-actions
vwidth = 1
vheight = 1
xwayland = true

[output:HDMI-A-1]
mode = 1280x800@60000
position = 0,0
transform = normal
scale = 1.000000

[autostart]
autostart_wf_shell = true
panel = wf-panel
dock = wf-dock
background = wf-background
radio-bar = waybar
gpsdr = /usr/local/bin/gp-sdr-kiosk

[command]
binding_terminal = <super> KEY_ENTER
command_terminal = xfce4-terminal
binding_launcher = <super> KEY_SPACE
command_launcher = wofi --show drun
binding_logout = <super> KEY_ESC
command_logout = /usr/local/lib/gp-sdr/display-session kiosk

[move]
activate = <super> BTN_LEFT
[resize]
activate = <super> BTN_RIGHT
