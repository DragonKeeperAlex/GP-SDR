[Service]
# whisper.cpp is installed under /opt/gp-sdr without placing its private
# runtime libraries in the global linker path. Keep the service environment
# explicit and local to GP-SDR so offline transcription can launch reliably.
Environment="PATH=/opt/gp-sdr/bin:/usr/local/bin:/usr/bin:/bin"
Environment="LD_LIBRARY_PATH=/opt/gp-sdr/lib"
Environment="GPSDR_WHISPER_MODEL=/opt/gp-sdr/whisper/ggml-tiny.en.bin"
