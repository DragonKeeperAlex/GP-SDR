# Site-specific drop-in for the current Pi. Adjust both paths before reuse.
# Do not replace the base service: it contains private access configuration.
[Unit]
RequiresMountsFor=/mnt/gp-sdr-data
ConditionPathIsMountPoint=/mnt/gp-sdr-data

[Service]
ExecStartPre=/usr/bin/test -w /mnt/gp-sdr-data/GP-SDR
MemoryAccounting=yes
CPUAccounting=yes
