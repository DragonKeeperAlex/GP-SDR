# GP-SDR Pi-local SHCHV/LCDWIKI 2.4-inch status display.
# Requires gp-sdr-ili9341-overlay.dts to be compiled and installed as
# /boot/firmware/overlays/gp-sdr-ili9341.dtbo before boot.
# Pins: CE0 LCD, CE1 touch, GPIO22 D/C, GPIO27 reset. Touch is intentionally
# not enabled by this read-only dashboard configuration.
dtoverlay=gp-sdr-ili9341
