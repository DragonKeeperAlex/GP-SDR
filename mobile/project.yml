name: GPSDRMobile
options:
  bundleIdPrefix: com.dragonkeeperalex
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
targets:
  GPSDRMobileCore:
    type: framework
    platform: iOS
    sources:
      - Sources/GPSDRMobileCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dragonkeeperalex.gpsdr.mobile.core
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
  GPSDRMobile:
    type: application
    platform: iOS
    sources:
      - Sources/GPSDRMobileApp
    dependencies:
      - target: GPSDRMobileCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dragonkeeperalex.gpsdr.mobile
        PRODUCT_NAME: GP-SDR
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: GP-SDR
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
schemes:
  GPSDRMobile:
    build:
      targets:
        GPSDRMobile: all
    run:
      config: Debug
