name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Version to package, such as 1.2.0
        required: true
        default: 1.2.0
      publish:
        description: Publish or replace the matching GitHub release
        type: boolean
        required: true
        default: false

concurrency:
  group: gp-sdr-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Test server
        working-directory: server
        run: |
          go test ./...
          go vet ./...
      - name: Check web console and attribution
        run: |
          node --check server/web/app.js
          test -s LICENSE
          test -s NOTICE
          test -s THIRD_PARTY.md

  package:
    runs-on: macos-15
    needs: test
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Build all release targets
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            VERSION="${{ inputs.version }}"
          elif [[ "$GITHUB_REF" == refs/heads/main && "$(git log -1 --pretty=%s)" == "Release GP-SDR "* ]]; then
            VERSION="$(sed -n 's/^var Version = "\([^"]*\)"/\1/p' server/internal/app/models.go)"
          else
            VERSION="1.2.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          chmod +x Scripts/build_release.sh
          Scripts/build_release.sh "$VERSION"
      - name: Verify packages
        run: |
          (cd dist && shasum -a 256 -c SHA256SUMS.txt)
          unzip -t "dist/GP-SDR-${VERSION}-macos-universal.zip"
          unzip -t "dist/GP-SDR-${VERSION}-windows-x86_64.zip"
          test -s "dist/GP-SDR-${VERSION}-macos-universal.dmg"
          test -s "dist/gp-sdr_${VERSION}_amd64.deb"
          test -s "dist/gp-sdr_${VERSION}_arm64.deb"
          test "$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 8
      - uses: actions/upload-artifact@v4
        with:
          name: GP-SDR-${{ github.sha }}
          path: dist/*
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release GP-SDR '))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION}"
          NOTES="Docs/RELEASE_NOTES_${VERSION}.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          elif [[ -f "$NOTES" ]]; then
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --notes-file "$NOTES" --title "GP-SDR $TAG"
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --generate-notes --title "GP-SDR $TAG"
          fi
