name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Test server
        working-directory: server
        run: |
          go test ./...
          go vet ./...
      - name: Check web console and attribution
        run: |
          node --check server/web/app.js
          test -s LICENSE
          test -s NOTICE
          test -s THIRD_PARTY.md

  package:
    runs-on: macos-15
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Build all release targets
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="0.3.0-dev.${GITHUB_RUN_NUMBER}"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          chmod +x Scripts/build_release.sh
          Scripts/build_release.sh "$VERSION"
      - name: Verify packages
        run: |
          (cd dist && shasum -a 256 -c SHA256SUMS.txt)
          unzip -t "dist/GP-SDR-${VERSION}-macos-universal.zip"
          unzip -t "dist/GP-SDR-${VERSION}-windows-x86_64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: GP-SDR-${{ github.sha }}
          path: dist/*
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "GP-SDR $GITHUB_REF_NAME"
